  /api/server/info:
    get:
      operationId: getServerInfo
      summary: Get server information
      description: |-
        Returns the current server status, database status, and server uptime.

        The database connection is checked with a timeout of 3 seconds.
        If the database check fails, HTTP 503 Service Unavailable is returned.
      parameters: []
      responses:
        "200":
          description: |
            HTTP 200 OK — the server is operational and the database
            connection check succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerInfo.ServerInfoResponse"
              example:
                service: Uranus API
                api_version: "1.0"
                response_type: get-server-info
                status: 200
                timestamp: 2026-09-20T09:26:00+02:00
                metadata:
                  response_time_ms: 12
                message: ""
                data:
                  status: ok
                  database: ok
                  uptime: 86400
        "500":
          description: |
            HTTP 500 Internal Server Error — server information
            could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerInfo.ResponseEnvelope"
        "503":
          description: |
            HTTP 503 Service Unavailable — the server is running,
            but the database connection check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerInfo.ServerInfoResponse"
              example:
                service: Uranus API
                api_version: "1.0"
                response_type: get-server-info
                status: 503
                timestamp: 2026-09-20T09:26:00+02:00
                metadata:
                  response_time_ms: 3010
                message: ""
                data:
                  status: error
                  database: error
                  uptime: 86400
      tags:
        - Server


components:

  parameters:

    EventOffsetParameter:
      name: offset
      in: query
      required: false
      description: |-
        Offset of the first result.
    
        Use together with `limit` for offset-based pagination.
      schema:
        type: integer
        format: int64
        minimum: 0

    EventLimitParameter:
      name: limit
      in: query
      required: false
      description: |-
        Maximum number of results requested.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10

    EventLastEventStartAtParameter:
      name: last_event_start_at
      in: query
      required: false
      description: |-
        Start timestamp of the last event date returned by the previous request.
    
        Omit this parameter for the first request.
    
        For subsequent requests, use together with `last_event_date_uuid` to continue cursor pagination.
    
        Both parameters must be provided together.
      schema:
        type: string

    EventLastEventDateUuidParameter:
      name: last_event_date_uuid
      in: query
      required: false
      description: |-
        UUID of the last event date returned by the previous request.
    
        Omit this parameter for the first request.
    
        For subsequent requests, use together with `last_event_start_at` to continue cursor pagination.
    
        Both parameters must be provided together.
      schema:
        type: string
        format: uuid

    EventStartParameter:
      name: start
      in: query
      required: false
      description: Start date in `YYYY-MM-DD` format. Defaults to the current date when omitted.
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$

    EventEndParameter:
      name: end
      in: query
      required: false
      description: Inclusive end date in `YYYY-MM-DD` format.
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$

    EventTimeParameter:
      name: time
      in: query
      required: false
      description: |
        Event-time filter. The value must contain a start time and an end time,
        separated by a comma.
        
        Supported time formats:
          - `HH,HH` for hours in 24-hour format.
          - `HHMM,HHMM` for hours and minutes in 24-hour format.
        
        Examples:
          - `10,14` matches events from 10:00 to 14:00.
          - `1030,1545` matches events from 10:30 to 15:45.
        
        The start time must be before the end time.
      schema:
        type: string
      examples:
        Hours:
          summary: Hours only
          value: 10,14
        HoursMinutes:
          summary: Hours and minutes
          value: 1030,1545

    EventCategoriesParameter:
      name: categories
      in: query
      required: false
      description: |
        Comma-separated list of one or more category IDs.
        
        Available categories:
          - `1` — Culture
          - `2` — Education
          - `3` — Sports
          - `4` — Leisure
          - `5` — Family
          - `6` — Society
        
        Multiple categories can be combined using commas.
      schema:
        type: string
      examples:
        Culture:
          summary: Culture
          value: "1"
        Education:
          summary: Education
          value: "2"
        Sports:
          summary: Sports
          value: "3"
        Leisure:
          summary: Leisure
          value: "4"
        Family:
          summary: Family
          value: "5"
        Society:
          summary: Society
          value: "6"
        Multiple:
          summary: Multiple categories
          value: 1,2,5

    EventSearchParameter:
      name: search
      in: query
      required: false
      description: Full-text search query.
      schema:
        type: string

    EventVenueParameter:
      name: venue
      in: query
      required: false
      description: |-
        Venue name search filter.
        
        The value can contain one or more names, separated by commas.
        Each name may optionally start or end with `*` as a wildcard.
        A wildcard matches any number of characters.
        
        Examples:
        - `theater` — exact name match
        - `theater,museum` — matches either name
        - `*theater` — name ending with "theater"
        - `theater*` — name starting with "theater"
        - `*theater*` — name containing "theater"
        - `*theater,*museum*` — names ending with "theater" or containing "museum"
      schema:
        type: string

    EventSpaceTypesParameter:
      name: space_types
      in: query
      required: false
      description: |-
        One or more space types, separated by commas.
        
        Known space types can be fetched from `/api/choosable-space-types`.
        
        Examples:
        - `club` — a single space type
        - `multifunctional_room,cafe` — multiple space types
      schema:
        type: string

    EventCountriesParameter:
      name: countries
      in: query
      required: false
      description: |-
        One or more country codes, separated by commas.
    
        Country codes use the three-letter ISO 3166-1 alpha-3 format.
    
        Examples:
        - `DEU` — Germany
        - `DNK,NOR` — Denmark and Norway
      schema:
        type: string

    EventPostalCodeParameter:
      name: postal_code
      in: query
      required: false
      description: |
        Comma-separated list of postal code patterns.
        
        Use `*` as a wildcard for partial matching:
          - `249*` matches postal codes starting with `249`.
          - `*509` matches postal codes ending with `509`.
          - `*608*` matches postal codes containing `608`.
          - `249*,2348*,*6000*` matches any of the specified patterns.
        
        Without `*`, an exact match is performed.
      schema:
        type: string
      examples:
        Prefix:
          summary: Postal code prefix
          value: 249*
        Suffix:
          summary: Postal code suffix
          value: "*937"
        Contains:
          summary: Partial postal code
          value: "*49*"
        Multiple:
          summary: Multiple patterns
          value: 249*,2348*,*6000*

    EventTitleParameter:
      name: title
      in: query
      required: false
      description: |-
        Searches the event title for the specified text.
    
        `*` can be used at the beginning or end of the value as a wildcard.
        A wildcard matches any number of characters.
    
        Examples:
        - `theater` — searches for the title "theater"
        - `*theater` — searches for titles ending with "theater"
        - `theater*` — searches for titles starting with "theater"
        - `*theater*` — searches for titles containing "theater"
      schema:
        type: string

    EventCityParameter:
      name: city
      in: query
      required: false
      description: |-
        One or more city names, separated by commas.
    
        `*` can be used at the beginning or end of a city name as a wildcard.
        A wildcard matches any number of characters.
    
        Examples:
        - `Flensburg` — searches for Flensburg
        - `Flensburg,Kiel` — searches for Flensburg or Kiel
        - `*burg` — searches for cities ending with "burg"
        - `Kiel*` — searches for cities starting with "Kiel"
        - `*burg*` — searches for cities containing "burg"
      schema:
        type: string

    EventTypesParameter:
      name: event_types
      in: query
      required: false
      description: |-
        One or more event type IDs, separated by commas.
    
        Available event types can be fetched from `/api/event/type-genre-lookup`.
    
        This parameter cannot be used together with `genres`.
      schema:
        type: string

    EventGenresParameter:
      name: genres
      in: query
      required: false
      description: |-
        One or more genre IDs, separated by commas.
    
        Available genres can be fetched from `/api/event/type-genre-lookup`.
    
        This parameter cannot be used together with `event_types`.
      schema:
        type: string

    EventTagsParameter:
      name: tags
      in: query
      required: false
      description: |-
        Comma-separated tags.
        
        Example: `theater,musical,family`
      schema:
        type: string

    EventAccessibilityParameter:
      name: accessibility
      in: query
      required: false
      description: |-
        One or more accessibility feature IDs, separated by commas.
    
        When multiple IDs are specified, the event location or space must provide all requested accessibility features.
    
        IDs and short descriptions of available accessibility features can be fetched from `/api/accessibility/flags`.
    
        Example: `1,3,5` requires all three accessibility features.
      schema:
        type: string

    EventVisitorInfosParameter:
      name: visitor_infos
      in: query
      required: false
      description: |-
        One or more visitor-information IDs, separated by commas.
    
        When multiple IDs are specified, the event must provide all requested visitor information.
    
        IDs and short descriptions of available visitor information can be fetched from `/api/visitor-info/flags`.
    
        Example: `1,3,5` requires all three visitor-information features.
      schema:
        type: string

    EventAgeParameter:
      name: age
      in: query
      required: false
      description: |-
        Age filter.
    
        One or two age values can be specified, separated by a comma.
    
        With two values, only events are returned that can be attended by people from the lower age to the higher age.
    
        With one value, events are returned that can be attended by people of the specified age.
    
        Examples:
        - `6` — events that can be attended by a 6-year-old
        - `6,12` — events that can be attended by people aged 6 to 12
      schema:
        type: string

    EventLongitudeParameter:
      name: lon
      in: query
      required: false
      description: |-
        Longitude of the center point for geographic filtering.
    
        The coordinate is specified as an EPSG:4326 longitude.
    
        The geographic filter is applied when `lon`, `lat`, and `radius` are provided together.
      schema:
        type: number
        format: double

    EventLatitudeParameter:
      name: lat
      in: query
      required: false
      description: |-
        Latitude of the center point for geographic filtering.
    
        The coordinate is specified as an EPSG:4326 latitude.
    
        The geographic filter is applied when `lon`, `lat`, and `radius` are provided together.
      schema:
        type: number
        format: double

    EventRadiusParameter:
      name: radius
      in: query
      required: false
      description: |-
        Radius of the geographic filter in meters.
    
        The geographic filter is applied when `lon`, `lat`, and `radius` are provided together. Events within the resulting circle are returned.
      schema:
        type: number
        format: double

    EventLangParameter:
      name: lang
      in: query
      required: false
      description: |-
        Two-letter language code used for localized data.
    
        Supported language codes include `de` (German), `da` (Danish), and `en` (English).
    
        All localized labels in the response are returned in the selected language, including event types, genres, accessibility features, visitor information, and other translated values.
      schema:
        type: string

    EventWeekStartParameter:
      name: week_start
      in: query
      required: false
      description: |-
        Start date of the week used for date-based event filtering.

        Format: `YYYY-MM-DD`
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$

    EventOrganizationUuidsParameter:
      name: org_uuids
      in: query
      required: false
      description: |-
        One or more organization UUIDs, separated by commas.

        Events belonging to any of the specified organizations are returned.
      schema:
        type: string

    EventVenueUuidsParameter:
      name: venue_uuids
      in: query
      required: false
      description: |-
        One or more venue UUIDs, separated by commas.

        Events taking place at any of the specified venues are returned.
      schema:
        type: string

    EventSpaceUuidsParameter:
      name: space_uuids
      in: query
      required: false
      description: |-
        One or more space UUIDs, separated by commas.

        Events taking place in any of the specified spaces are returned.
      schema:
        type: string

    EventEventUuidsParameter:
      name: event_uuids
      in: query
      required: false
      description: |-
        One or more event UUIDs, separated by commas.

        Events matching any of the specified UUIDs are returned.
      schema:
        type: string

    EventGeolistRegionParameter:
      name: geolist_region
      in: query
      required: false
      description: |-
        Geographic region filter.
    
        The value contains three comma-separated region slugs:
        country, state or region, city.
    
        Example: `deutschland,schleswig-holstein,flensburg`
    
        The specified region is used to determine the geographic area for event filtering.
    
        This parameter cannot be combined with `portal`.
      schema:
        type: string

    EventPortalParameter:
      name: portal
      in: query
      required: false
      description: |-
        Portal UUID used to filter events belonging to a specific portal.

        This parameter cannot be combined with `geolist_region`.
      schema:
        type: string
        format: uuid

