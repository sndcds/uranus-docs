      properties:
        uuid:
          type: string
        name:
          type: string
        city:
          anyOf:
            - type: string
            - type: "null"
        country:
          anyOf:
            - type: string
            - type: "null"
        event_count:
          type: integer
    GetEvents.Parameters.Accessibility:
      type: object
      properties:
        accessibility:
          type: string
          description: Accessibility filter. Syntax is interpreted by the API filter parser.
    GetEvents.Parameters.Age:
      type: object
      properties:
        age:
          type: string
          description: Age filter. Syntax is interpreted by the API filter parser.
    GetEvents.Parameters.Categories:
      type: object
      properties:
        categories:
          type: string
          description: |-
            Comma-separated list of one or more category IDs.

            Available categories:
            - `1` — Culture
            - `2` — Education
            - `3` — Sports
            - `4` — Leisure
            - `5` — Family
            - `6` — Society

            Multiple categories can be combined using commas.
    GetEvents.Parameters.City:
      type: object
      properties:
        city:
          type: string
          description: Venue city filter.
    GetEvents.Parameters.Countries:
      type: object
      properties:
        countries:
          type: string
          description: Comma-separated country codes.
    GetEvents.Parameters.End:
      type: object
      properties:
        end:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive end date in YYYY-MM-DD format.
    GetEvents.Parameters.EventTypes:
      type: object
      properties:
        event_types:
          type: string
          description: Comma-separated event type IDs. Cannot be used together with genres.
    GetEvents.Parameters.EventUuids:
      type: object
      properties:
        event_uuids:
          type: string
          description: Comma-separated event UUID values.
    GetEvents.Parameters.Genres:
      type: object
      properties:
        genres:
          type: string
          description: Comma-separated genre IDs. Cannot be used together with event_types.
    GetEvents.Parameters.GeolistRegion:
      type: object
      properties:
        geolist_region:
          type: string
          description: |-
            Geographic region filter. Must contain exactly three comma-separated
            components (lon,lat,radius). Cannot be combined with portal.
    GetEvents.Parameters.Lang:
      type: object
      properties:
        lang:
          type: string
          description: Language/locale value accepted by the event filter.
    GetEvents.Parameters.LastEventDateUuid:
      type: object
      properties:
        last_event_date_uuid:
          type: string
          description: Cursor event-date UUID used with last_event_start_at.
    GetEvents.Parameters.LastEventStartAt:
      type: object
      properties:
        last_event_start_at:
          type: string
          description: Cursor timestamp used with last_event_date_uuid for stable pagination.
    GetEvents.Parameters.Lat:
      type: object
      properties:
        lat:
          type: number
          format: double
          description: Latitude used for radius filtering.
    GetEvents.Parameters.Limit:
      type: object
      properties:
        limit:
          type: integer
          format: int64
          minimum: 0
          description: Maximum number of results requested.
    GetEvents.Parameters.Lon:
      type: object
      properties:
        lon:
          type: number
          format: double
          description: Longitude used for radius filtering.
    GetEvents.Parameters.Offset:
      type: object
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Legacy offset pagination. Integer value.
    GetEvents.Parameters.OrgUuids:
      type: object
      properties:
        org_uuids:
          type: string
          description: Comma-separated organization UUID values.
    GetEvents.Parameters.Portal:
      type: object
      properties:
        portal:
          type: string
          description: Portal UUID filter. Cannot be combined with geolist_region.
    GetEvents.Parameters.PostalCode:
      type: object
      properties:
        postal_code:
          type: string
          description: |-
            Comma-separated list of postal code patterns.

            Use `*` as a wildcard for partial matching:
            - `249*` matches postal codes starting with `249`.
            - `*509` matches postal codes ending with `509`.
            - `*608*` matches postal codes containing `608`.
            - `249*,2348*,*6000*` matches any of the specified patterns.

            Without `*`, an exact match is performed.
    GetEvents.Parameters.Price:
      type: object
      properties:
        price:
          type: string
          description: Price filter. Syntax is interpreted by the API filter parser.
    GetEvents.Parameters.Radius:
      type: object
      properties:
        radius:
          type: number
          format: double
          description: Radius used for geographic filtering.
    GetEvents.Parameters.Search:
      type: object
      properties:
        search:
          type: string
          description: Full-text search query.
    GetEvents.Parameters.SpaceTypes:
      type: object
      properties:
        space_types:
          type: string
          description: Comma-separated space type values.
    GetEvents.Parameters.SpaceUuids:
      type: object
      properties:
        space_uuids:
          type: string
          description: Comma-separated space UUID values.
    GetEvents.Parameters.Start:
      type: object
      properties:
        start:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Start date in YYYY-MM-DD format. Defaults to the current date when omitted.
    GetEvents.Parameters.Tags:
      type: object
      properties:
        tags:
          type: string
          description: Comma-separated tags.
    GetEvents.Parameters.Time:
      type: object
      properties:
        time:
          type: string
          description: |-
            Event-time filter. The value must contain a start time and an end time,
            separated by a comma.

            Supported time formats:
            - `HH,HH` for hours in 24-hour format.
            - `HHMM,HHMM` for hours and minutes in 24-hour format.

            Examples:
            - `10,14` matches events from 10:00 to 14:00.
            - `1030,1545` matches events from 10:30 to 15:45.

            The start time must be before the end time.
    GetEvents.Parameters.Title:
      type: object
      properties:
        title:
          type: string
          description: Title text filter.
    GetEvents.Parameters.Venue:
      type: object
      properties:
        venue:
          type: string
          description: Venue name/text filter.
    GetEvents.Parameters.VenueUuids:
      type: object
      properties:
        venue_uuids:
          type: string
          description: Comma-separated venue UUID values.
    GetEvents.Parameters.VisitorInfos:
      type: object
      properties:
        visitor_infos:
          type: string
          description: Visitor-information filter. Syntax is interpreted by the API filter parser.
    GetEvents.Parameters.WeekStart:
      type: object
      properties:
        week_start:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Optional week start date in YYYY-MM-DD format.
    GetEvents.Parameters.WeekStartRequired:
      type: object
      required:
        - week_start
      properties:
        week_start:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Required week start date in YYYY-MM-DD format.
    GetEvents.SummaryEntry:
      type: object
      required:
        - id
        - count
      properties:
        id:
          type: integer
        count:
          type: integer
    GetEvents.VenueSummaryEntry:
