        venue_name:
          type: string
        date_count:
          type: integer
    GetServerInfo.ResponseEnvelope:
      type: object
      required:
        - service
        - api_version
        - response_type
        - status
        - timestamp
      properties:
        service:
          type: string
          example: Uranus API
        api_version:
          type: string
          example: "1.0"
        response_type:
          type: string
          example: get-server-info
        status:
          type: integer
          description: HTTP status code of the current response.
          example: 200
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          properties:
            response_time_ms:
              type: integer
              minimum: 0
              example: 12
        message:
          type: string
    GetServerInfo.ServerInfoResponse:
      type: object
      required:
        - service
        - api_version
        - response_type
        - status
        - timestamp
        - data
      properties:
        service:
          type: string
          example: Uranus API
        api_version:
          type: string
          example: "1.0"
        response_type:
          type: string
          example: get-server-info
        status:
          type: integer
          description: HTTP status code of the current response.
          example: 200
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          properties:
            response_time_ms:
              type: integer
              minimum: 0
              example: 12
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
              enum:
                - ok
                - error
              example: ok
            database:
              type: string
              enum:
                - ok
                - error
              example: ok
            uptime:
              type: integer
              format: int64
              minimum: 0
              description: Server uptime in seconds.
              example: 86400
          required:
            - status
            - database
            - uptime
