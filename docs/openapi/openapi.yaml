  /api/events/geojson:
    get:
      operationId: getEventsGeoJSON
      summary: Get event venues as GeoJSON
      description: |-
        Returns venues with matching events as a GeoJSON FeatureCollection.
        Geometry coordinates are [longitude, latitude].

        Venues for which valid point geometry cannot be produced are skipped.
        If no venues are found, the API returns 204 No Content.
      parameters:
        - name: offset
          in: query
          required: false
          description: Legacy offset pagination. Integer value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of results requested.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 10
        - name: start
          in: query
          required: false
          description: Start date in YYYY-MM-DD format. Defaults to the current date when omitted.
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: end
          in: query
          required: false
          description: Inclusive end date in YYYY-MM-DD format.
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: time
          in: query
          required: false
          description: |
            Event-time filter. The value must contain a start time and an end time,
            separated by a comma.

            Supported time formats:
              - `HH,HH` for hours in 24-hour format.
              - `HHMM,HHMM` for hours and minutes in 24-hour format.

            Examples:
              - `10,14` matches events from 10:00 to 14:00.
              - `1030,1545` matches events from 10:30 to 15:45.

            The start time must be before the end time.
          schema:
            type: string
          examples:
            Hours:
              summary: Hours only
              value: 10,14
            HoursMinutes:
              summary: Hours and minutes
              value: 1030,1545
        - name: categories
          in: query
          required: false
          description: |
            Comma-separated list of one or more category IDs.

            Available categories:
              - `1` — Culture
              - `2` — Education
              - `3` — Sports
              - `4` — Leisure
              - `5` — Family
              - `6` — Society

            Multiple categories can be combined using commas.
          schema:
            type: string
          examples:
            Culture:
              summary: Culture
              value: "1"
            Education:
              summary: Education
              value: "2"
            Sports:
              summary: Sports
              value: "3"
            Leisure:
              summary: Leisure
              value: "4"
            Family:
              summary: Family
              value: "5"
            Society:
              summary: Society
              value: "6"
            Multiple:
              summary: Multiple categories
              value: 1,2,5
        - name: search
          in: query
          required: false
          description: Full-text search query.
          schema:
            type: string
        - name: venue
          in: query
          required: false
          description: Venue name/text filter.
          schema:
            type: string
        - name: space_types
          in: query
          required: false
          description: Comma-separated space type values.
          schema:
            type: string
        - name: countries
          in: query
          required: false
          description: Comma-separated country codes.
          schema:
            type: string
        - name: postal_code
          in: query
          required: false
          description: |
            Comma-separated list of postal code patterns.

            Use `*` as a wildcard for partial matching:
              - `249*` matches postal codes starting with `249`.
              - `*509` matches postal codes ending with `509`.
              - `*608*` matches postal codes containing `608`.
              - `249*,2348*,*6000*` matches any of the specified patterns.

            Without `*`, an exact match is performed.
          schema:
            type: string
          examples:
            Prefix:
              summary: Postal code prefix
              value: 249*
            Suffix:
              summary: Postal code suffix
              value: "*937"
            Contains:
              summary: Partial postal code
              value: "*49*"
            Multiple:
              summary: Multiple patterns
              value: 249*,2348*,*6000*
        - name: title
          in: query
          required: false
          description: Title text filter.
          schema:
            type: string
        - name: city
          in: query
          required: false
          description: Venue city filter.
          schema:
            type: string
        - name: event_types
          in: query
          required: false
          description: |
            Comma-separated event type IDs. Cannot be used together with genres.
          schema:
            type: string
        - name: genres
          in: query
          required: false
          description: |
            Comma-separated genre IDs. Cannot be used together with event_types.
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: Comma-separated tags.
          schema:
            type: string
        - name: accessibility
          in: query
          required: false
          description: Accessibility filter. Syntax is interpreted by the API filter parser.
          schema:
            type: string
        - name: visitor_infos
          in: query
          required: false
          description: Visitor-information filter. Syntax is interpreted by the API filter parser.
          schema:
            type: string
        - name: age
          in: query
          required: false
          description: Age filter. Syntax is interpreted by the API filter parser.
          schema:
            type: string
        - name: price
          in: query
          required: false
          description: Price filter. Syntax is interpreted by the API filter parser.
          schema:
            type: string
        - name: lon
          in: query
          required: false
          description: Longitude used for radius filtering.
          schema:
            type: number
            format: double
        - name: lat
          in: query
          required: false
          description: Latitude used for radius filtering.
          schema:
            type: number
            format: double
        - name: radius
          in: query
          required: false
          description: Radius used for geographic filtering.
          schema:
            type: number
            format: double
        - name: last_event_start_at
          in: query
          required: false
          description: Cursor timestamp used with last_event_date_uuid for stable pagination.
          schema:
            type: string
        - name: last_event_date_uuid
          in: query
          required: false
          description: Cursor event-date UUID used with last_event_start_at.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language/locale value accepted by the event filter.
          schema:
            type: string
        - name: week_start
          in: query
          required: false
          description: Optional week start date in YYYY-MM-DD format.
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: org_uuids
          in: query
          required: false
          description: Comma-separated organization UUID values.
          schema:
            type: string
        - name: venue_uuids
          in: query
          required: false
          description: Comma-separated venue UUID values.
          schema:
            type: string
        - name: space_uuids
          in: query
          required: false
          description: Comma-separated space UUID values.
          schema:
            type: string
        - name: event_uuids
          in: query
          required: false
          description: Comma-separated event UUID values.
          schema:
            type: string
        - name: geolist_region
          in: query
          required: false
          description: |
            Geographic region filter. Must contain exactly three comma-separated
            components (lon,lat,radius). Cannot be combined with portal.
          schema:
            type: string
        - name: portal
          in: query
          required: false
          description: Portal UUID filter. Cannot be combined with geolist_region.
          schema:
            type: string
      responses:
        "200":
          description: GeoJSON FeatureCollection returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.GeoJSONFeatureCollection"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/GetEvents.GeoJSONFeatureCollection"
        "204":
          description: No venues found.
        "400":
          description: Invalid request or filter parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
      tags:
        - Events

