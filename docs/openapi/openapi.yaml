openapi: 3.1.0
info:
  title: Uranus API
  version: "1.0"
  description: API for the Uranus / kulturbytes platform.

servers:
  - url: https://api.kulturbytes.de
    description: Production API

paths:

  /api/events:
    get:
      tags:
        - Events
      operationId: getEvents
      summary: 1. Get events
      description: |-
        Returns events matching the supplied filters.
      
        GET query parameters are validated by the API.
        Unknown query parameters result in a bad-request response.
        Array-valued filters are supplied as comma-separated values.
      
        Pagination – The API supports two pagination strategies.
      
        Offset pagination:  
        Use `offset` together with `limit` for ad hoc requests where a specific result page is needed.
      
        Cursor pagination:        
        Use `last_event_start_at` together with `last_event_date_uuid` for stable, continuous pagination through the event list.
      
        Cursor pagination is best suited for endless presentation of events, such as event lists on websites.  
        This is the pagination strategy used by kulturbytes websites.  
        Both `last_event_start_at` and `last_event_date_uuid` must be provided together.

      parameters:
        - $ref: '#/components/parameters/EventOffsetParameter'
        - $ref: '#/components/parameters/EventLimitParameter'
        - $ref: '#/components/parameters/EventLastEventStartAtParameter'
        - $ref: '#/components/parameters/EventLastEventDateUuidParameter'
        - $ref: '#/components/parameters/EventLangParameter'
        - $ref: '#/components/parameters/EventStartParameter'
        - $ref: '#/components/parameters/EventEndParameter'
        - $ref: '#/components/parameters/EventTimeParameter'
        - $ref: '#/components/parameters/EventCategoriesParameter'
        - $ref: '#/components/parameters/EventSearchParameter'
        - $ref: '#/components/parameters/EventVenueParameter'
        - $ref: '#/components/parameters/EventSpaceTypesParameter'
        - $ref: '#/components/parameters/EventCountriesParameter'
        - $ref: '#/components/parameters/EventPostalCodeParameter'
        - $ref: '#/components/parameters/EventTitleParameter'
        - $ref: '#/components/parameters/EventCityParameter'
        - $ref: '#/components/parameters/EventTypesParameter'
        - $ref: '#/components/parameters/EventGenresParameter'
        - $ref: '#/components/parameters/EventTagsParameter'
        - $ref: '#/components/parameters/EventAccessibilityParameter'
        - $ref: '#/components/parameters/EventVisitorInfosParameter'
        - $ref: '#/components/parameters/EventAgeParameter'
        - name: price
          in: query
          required: false
          description: Price filter. Syntax is interpreted by the API filter parser.
          schema:
            type: string
        - $ref: '#/components/parameters/EventLongitudeParameter'
        - $ref: '#/components/parameters/EventLatitudeParameter'
        - $ref: '#/components/parameters/EventRadiusParameter'
        - $ref: '#/components/parameters/EventOrganizationUuidsParameter'
        - $ref: '#/components/parameters/EventVenueUuidsParameter'
        - $ref: '#/components/parameters/EventSpaceUuidsParameter'
        - $ref: '#/components/parameters/EventEventUuidsParameter'
        - $ref: '#/components/parameters/EventGeolistRegionParameter'
        - $ref: '#/components/parameters/EventPortalParameter'

      responses:
        "200":
          description: Events returned successfully.
          content:
            application/json:
              example:
                service: Uranus API
                api_version: "1.0"
                response_type: get-events
                status: 200
                timestamp: "2026-09-23T05:22:50Z"
                metadata:
                  response_time_ms: 6
                data:
                  events:
                    - search_rank: 1
                      uuid: "01a09fe9-0b46-7624-b0c7-4693e24250a2"
                      date_uuid: "01a0a01b-0557-762a-8f1a-7bb307e4c37a"
                      date_slug: "202609230900"
                      title: "Malkreis Glücksburg"
                      subtitle: "Deine kreative Zeit für Farbe, Ideen und gemeinsames Gestalten"
                      summary: "Im Malkreis Glücksburg kannst du eigene Bildideen verwirklichen, neue Techniken ausprobieren und dich mit anderen Kreativen austauschen."
                      start_date: "2026-09-23"
                      start_time: "09:00"
                      end_date: "2026-09-23"
                      end_time: "12:00"
                      space_uuid: "019eb0ad-e0a5-711b-b216-6cd9fde38acf"
                      space_name: "Atelier Kreativecke"
                      venue_uuid: "019eb0a5-852e-753a-a1cb-ad5a9a5948fb"
                      venue_name: "Atelier Kreativecke"
                      venue_city: "Glücksburg"
                      venue_street: "Rathausstaße"
                      venue_house_number: "11"
                      venue_postal_code: "24960"
                      venue_state: "SH"
                      venue_country: "DEU"
                      venue_lat: 54.8349485775689
                      venue_lon: 9.54897141524646
                      image_uuid: "01a09fed-c812-7d7e-b5ff-312de6185160"
                      image_path: "https://api.kulturbytes.de/api/image/01a09fed-c812-7d7e-b5ff-312de6185160"
                      image_ai_label: "none"
                      org_uuid: "019ea6d1-e26e-79f3-9c4b-6f9f54e4c1d9"
                      org_name: "Atelier Kreativecke"
                      categories: [1, 2, 4, 6]
                      event_types:
                        - type_id: 34
                          genre_id: 0
                        - type_id: 40
                          genre_id: 0
                        - type_id: 8
                          genre_id: 0
                      languages: []
                      tags: []
                      min_age: 18
                      max_age: 111
                      price_type: "not_specified"
                      visitor_info_flags: "136352024"
                      release_status: "released"

                  last_event_date_uuid: "01a0a91d-17a4-72a5-b67a-46389cc97e27"
                  last_event_start_at: "2026-09-23T14:30:00+02:00"

        "400":
          description: Invalid request or filter parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"

  /api/events/week:
    get:
      tags:
        - Events
      operationId: getEventsWeek
      summary: 2. Get events for a week
      description: |-
        Returns events grouped by day for a seven-day period.
        The start parameter is required and must use YYYY-MM-DD format.
        The endpoint automatically calculates the end date as start plus six days.
        The end parameter is not used by this endpoint.
  
        All other query parameters behave exactly as described for GET /api/events,
        including their validation and filtering behavior.

      responses:
        "200":
          description: Week data returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.EventsWeekResponse"
        "400":
          description: Invalid request or filter parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"

  /api/events/filter:
    post:
      tags:
        - Events
      operationId: filterEvents
      summary: 3. Get events using JSON payload for filtering
      description: |-
        Returns events matching the supplied JSON filter object.

        Unknown JSON properties are ignored by the current implementation.
        Array-valued properties are represented as JSON arrays.
      parameters: []
      responses:
        "200":
          description: Events returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.EventsResponse"
        "400":
          description: Invalid request or filter parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents.ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetEvents.EventFilterRequest"

  /api/event/{eventUuid}:
    get:
      tags:
        - Events
      operationId: getEvent
      summary: 4. Get event details
      description: >-
        Returns a single event. If no event date is explicitly requested, the API selects the
        nearest upcoming date. If there is no upcoming date, the latest past date is selected.

        Public users can access events with the statuses released, cancelled, deferred and
        rescheduled. Users with appropriate event organizer permissions may also access draft and
        review events.
      parameters:
        - name: eventUuid
          in: path
          required: true
          description: Event UUID.
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Content language.
          schema:
            type: string
            default: en
            example: en
      responses:
        "200":
          description: Event successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvent.EventDetails"
        "404":
          description: Event not found.
        "500":
          description: Internal server error.

  /api/event/{eventUuid}/date/{dateUuid}:
    get:
      tags:
        - Events

      operationId: getEventByDate
      summary: 5. Get event details by date
      description: Returns an event with a specific event date selected. The selected date is returned in
        the date property and all other event dates are returned in furtherDates.
      parameters:
        - name: eventUuid
          in: path
          required: true
          description: Event UUID.
          schema:
            type: string
            format: uuid
        - name: dateIdentifier
          in: path
          required: true
          description: Event date UUID or slug as YYYYMMDDHHMM.
          schema:
            type: string
            format: string
        - name: lang
          in: query
          required: false
          description: Content language.
          schema:
            type: string
            default: en
            example: en
      responses:
        "200":
          description: Event successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvent.EventDetails"
        "404":
          description: Event not found.
        "500":
          description: Internal server error.

  /api/choosable-countries:
    get:
      operationId: getChoosableCountries
      summary: Get choosable countries
      description: |-
        Returns all countries available for selection.

        Country names are localized according to the requested
        ISO 639-1 language code.

        If no countries are found for the requested language, the endpoint
        still returns HTTP 200 with an empty data array.
      parameters:
        - name: lang
          in: query
          required: false
          description: ISO 639-1 language code. Defaults to English.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: en
            example: en
      responses:
        "200":
          description: Countries found, or no countries available for the requested language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChoosableCountries.GetChoosableCountriesResponse200"
              example:
                service: Uranus API
                api_version: "1.0"
                response_type: get-choosable-countries
                status: 200
                timestamp: 2026-09-20T09:48:48Z
                metadata:
                  country_count: 249
                  language: en
                  response_time_ms: 95
                data:
                  - country_code: AFG
                    country_name: Afghanistan
                  - country_code: ALB
                    country_name: Albania
                  - country_code: DZA
                    country_name: Algeria
                  - country_code: ASM
                    country_name: American Samoa
                  - country_code: AND
                    country_name: Andorra
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChoosableCountries.GetChoosableCountriesResponse500"
              example:
                service: Uranus API
                api_version: "1.0"
                response_type: get-choosable-countries
                status: 500
                timestamp: 2026-09-20T09:48:48Z
                metadata:
                  language: en
                  response_time_ms: 95
                data: null
                message: Internal server error

